type: tracking
start: 0
end: 200000
stop: 0

# Monotonic freshness timestamps require the z server and policy on this same
# onboard computer. Do not point this at a second machine without clock sync.
ctx_source: zmq
ctx_zmq_addr: tcp://127.0.0.1:28711
ctx_norm_ref: 16.0
ctx_zmq_timeout_ms: 200
ctx_zmq_source_timeout_ms: 200
ctx_zmq_result_timeout_ms: 100
ctx_zmq_future_tolerance_ms: 10

gamma: 0.8
window_size: 1
